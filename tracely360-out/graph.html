const LEGEND = [];
const RAW_NODE_MAP = new Map(RAW_NODES.map(n => [n.id, n]));
const COMMUNITY_NODE_MAP = new Map();

RAW_NODES.forEach(n => {
    if (!COMMUNITY_NODE_MAP.has(n.community)) {
        COMMUNITY_NODE_MAP.set(n.community, []);
    }
    COMMUNITY_NODE_MAP.get(n.community).push(n);
});

// HTML-escape helper — prevents XSS when injecting graph data into innerHTML
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Build vis datasets
const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
  id: n.id, label: n.label, color: n.color, size: n.size,
    font: n.font, title: n.title, shape: n.shape,
  _community: n.community, _community_name: n.community_name,
  _source_file: n.source_file, _file_type: n.file_type, _degree: n.degree,
})));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i, from: e.from, to: e.to,
  label: '',
  title: e.title,
  dashes: e.dashes,
  width: e.width,
  color: e.color,
  arrows: { to: { enabled: true, scaleFactor: 0.5 } },
})));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -60,
      centralGravity: 0.005,
      springLength: 120,
      springConstant: 0.08,
      damping: 0.4,
      avoidOverlap: 0.8,
    },
    stabilization: { iterations: 200, fit: true },
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    hideEdgesOnDrag: true,
    navigationButtons: false,
    keyboard: false,
  },
  nodes: { shape: 'dot', borderWidth: 1.5 },
  edges: { smooth: { type: 'continuous', roundness: 0.2 }, selectionWidth: 3 },
});

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
});

let activeNodeId = null;
let activeCommunityId = null;
const DEFAULT_NODE_NEIGHBOR_LIMIT = 18;
const DEFAULT_CLUSTER_NODE_LIMIT = 24;
let activeNodeNeighborLimit = DEFAULT_NODE_NEIGHBOR_LIMIT;
let activeClusterNodeLimit = DEFAULT_CLUSTER_NODE_LIMIT;

function setSectionCollapsed(sectionId, collapsed) {
    const section = document.getElementById(sectionId);
    if (!section) return;
    const body = section.querySelector('.section-body');
    const button = section.querySelector('.section-toggle');
    if (!body || !button) return;
    body.classList.toggle('is-hidden', collapsed);
    section.classList.toggle('collapsed', collapsed);
    button.textContent = collapsed ? 'Show' : 'Hide';
    button.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
}

function sortNodes(nodes) {
    return nodes.slice().sort((left, right) => {
        if (right.degree !== left.degree) return right.degree - left.degree;
        return String(left.label).localeCompare(String(right.label));
    });
}

function buildNodeLinks(nodes, limit = 24) {
    const sorted = sortNodes(nodes);
    const visible = sorted.slice(0, limit);
    const html = visible.map(node => {
        const color = node && node.color ? node.color.background : '#555';
        return `<span class="neighbor-link" style="border-left-color:${esc(color)}" data-node-id="${esc(String(node.id))}">${esc(node.label)}</span>`;
    }).join('');
    return { html, remaining: Math.max(sorted.length - visible.length, 0), total: sorted.length };
}

function buildExpandButton(kind, remaining, noun) {
    if (remaining <= 0) return '';
    return `<button type="button" class="details-expand" data-expand-kind="${esc(kind)}">...and ${remaining} more ${esc(noun)}</button>`;
}

function showEmptyInfo() {
    document.getElementById('info-content').innerHTML = '<span class="empty">Click a node or cluster to inspect it</span>';
}

function showNodeInfo(nodeId) {
    const rawNode = RAW_NODE_MAP.get(nodeId) || {};
    const datasetNode = nodesDS.get(nodeId) || {};
    const label = rawNode.label || datasetNode.label || nodeId;
    const fileType = datasetNode._file_type || rawNode.file_type || 'unknown';
    const communityName = datasetNode._community_name || rawNode.community_name || 'unknown';
    const sourceFile = datasetNode._source_file || rawNode.source_file || '-';
    const degree = datasetNode._degree ?? rawNode.degree ?? '-';
  const neighborIds = network.getConnectedNodes(nodeId);
    const neighborNodes = neighborIds
        .map(nid => RAW_NODE_MAP.get(nid) || nodesDS.get(nid))
        .filter(Boolean);
        const neighborList = buildNodeLinks(neighborNodes, activeNodeNeighborLimit);
  document.getElementById('info-content').innerHTML = `
        <div class="field"><b>${esc(label)}</b></div>
        <div class="field">Type: ${esc(fileType)}</div>
        <div class="field">Cluster: ${esc(communityName)}</div>
        <div class="field">Source: ${esc(sourceFile)}</div>
        <div class="field">Degree: ${degree}</div>
                ${neighborIds.length ? `<div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Neighbors (${neighborIds.length})</div><div class="details-list">${neighborList.html}</div>${buildExpandButton('neighbors', neighborList.remaining, 'neighbors')}` : ''}
  `;
}

function showCommunityInfo(communityId) {
    const communityNodes = COMMUNITY_NODE_MAP.get(communityId) || [];
    if (!communityNodes.length) {
        showEmptyInfo();
        return;
    }
    const communityName = communityNodes[0].community_name || `Cluster ${communityId}`;
    const nodeList = buildNodeLinks(communityNodes, activeClusterNodeLimit);
    const strongestNode = sortNodes(communityNodes)[0];
    document.getElementById('info-content').innerHTML = `
        <div class="field"><b>${esc(communityName)}</b></div>
        <div class="field">Cluster ID: ${communityId}</div>
        <div class="field">Nodes: ${communityNodes.length}</div>
        <div class="field">Top node: ${esc(strongestNode ? strongestNode.label : '-')}</div>
        <div class="field hint" style="margin-top:8px">Click a node below to drill into it.</div>
        <div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Cluster nodes</div>
        <div class="details-list">${nodeList.html}</div>
        ${buildExpandButton('cluster-nodes', nodeList.remaining, 'nodes')}
    `;
}

function updateLegendState() {
    document.querySelectorAll('.legend-item').forEach(item => {
        item.classList.toggle('active', item.dataset.communityId === String(activeCommunityId));
    });
}

function applySelectionState() {
    let visibleNodeIds = null;
    if (activeNodeId !== null) {
        visibleNodeIds = new Set([activeNodeId]);
    } else if (activeCommunityId !== null) {
        visibleNodeIds = new Set((COMMUNITY_NODE_MAP.get(activeCommunityId) || []).map(node => node.id));
    }

    nodesDS.update(RAW_NODES.map(node => ({
        id: node.id,
        hidden: visibleNodeIds ? !visibleNodeIds.has(node.id) : false,
    })));
    edgesDS.update(RAW_EDGES.map((edge, index) => ({
        id: index,
        hidden: visibleNodeIds ? !(visibleNodeIds.has(edge.from) && visibleNodeIds.has(edge.to)) : false,
    })));
    updateLegendState();
}

function clearSelection(options = {}) {
    activeNodeId = null;
    activeCommunityId = null;
    activeNodeNeighborLimit = DEFAULT_NODE_NEIGHBOR_LIMIT;
    activeClusterNodeLimit = DEFAULT_CLUSTER_NODE_LIMIT;
    applySelectionState();
    network.unselectAll();
    showEmptyInfo();
    if (options.resetView) {
        network.fit({ animation: true });
    }
}

function selectNode(nodeId, options = {}) {
    if (!RAW_NODE_MAP.has(nodeId)) return;
    activeNodeId = nodeId;
    activeCommunityId = null;
    activeNodeNeighborLimit = DEFAULT_NODE_NEIGHBOR_LIMIT;
    applySelectionState();
    network.selectNodes([nodeId]);
    showNodeInfo(nodeId);
    if (options.focus !== false) {
        network.focus(nodeId, { scale: 1.4, animation: true });
    }
}

function selectCommunity(communityId, options = {}) {
    const communityNodes = COMMUNITY_NODE_MAP.get(communityId) || [];
    if (!communityNodes.length) return;
    if (activeCommunityId === communityId && options.toggle !== false) {
        clearSelection({ resetView: true });
        return;
    }
    activeCommunityId = communityId;
    activeNodeId = null;
    activeClusterNodeLimit = DEFAULT_CLUSTER_NODE_LIMIT;
    applySelectionState();
    network.unselectAll();
    showCommunityInfo(communityId);
    if (options.fit !== false) {
        network.fit({ nodes: communityNodes.map(node => node.id), animation: true });
    }
}

function focusNode(nodeId) {
    selectNode(nodeId);
}

document.getElementById('info-content').addEventListener('click', event => {
    const nodeLink = event.target.closest('.neighbor-link');
    if (nodeLink) {
        const nodeId = nodeLink.getAttribute('data-node-id');
        if (!nodeId) return;
        focusNode(nodeId);
        return;
    }
    const expandButton = event.target.closest('.details-expand');
    if (!expandButton) return;
    const expandKind = expandButton.getAttribute('data-expand-kind');
    if (expandKind === 'neighbors' && activeNodeId !== null) {
        activeNodeNeighborLimit = Number.MAX_SAFE_INTEGER;
        showNodeInfo(activeNodeId);
    } else if (expandKind === 'cluster-nodes' && activeCommunityId !== null) {
        activeClusterNodeLimit = Number.MAX_SAFE_INTEGER;
        showCommunityInfo(activeCommunityId);
    }
});

document.getElementById('sidebar').addEventListener('click', event => {
    const toggle = event.target.closest('.section-toggle');
    if (!toggle) return;
    const sectionId = toggle.getAttribute('data-section-id');
    if (!sectionId) return;
    const section = document.getElementById(sectionId);
    if (!section) return;
    setSectionCollapsed(sectionId, !section.classList.contains('collapsed'));
});

// Track hovered node — hover detection is more reliable than click params
let hoveredNodeId = null;
network.on('hoverNode', params => {
  hoveredNodeId = params.node;
  container.style.cursor = 'pointer';
});
network.on('blurNode', () => {
  hoveredNodeId = null;
  container.style.cursor = 'default';
});
container.addEventListener('click', () => {
  if (hoveredNodeId !== null) {
        selectNode(hoveredNodeId);
  }
});
network.on('click', params => {
    if (hoveredNodeId === null && params.nodes.length > 0) {
        selectNode(params.nodes[0], { focus: false });
  } else if (hoveredNodeId === null) {
        clearSelection();
  }
});

const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.style.borderLeft = `3px solid ${n.color.background}`;
    el.style.paddingLeft = '8px';
    el.onclick = () => {
            selectNode(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});
document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput)
    searchResults.style.display = 'none';
});

const legendEl = document.getElementById('legend');
LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
    item.dataset.communityId = String(c.cid);
    item.innerHTML = `<div class="legend-dot" style="background:${esc(c.color)}"></div>
        <span class="legend-label">${esc(c.label)}</span>
    <span class="legend-count">${c.count}</span>`;
  item.onclick = () => {
        selectCommunity(c.cid);
  };
  legendEl.appendChild(item);
});

showEmptyInfo();
updateLegendState();
</script>

ot_repo", "adapter_copilot_path", "adapter_agents_md", "adapter_cursor", "adapter_claude_code", "adapter_aider", "adapter_codex", "adapter_gemini_cli"], "relation": "first_class_adapter_family", "source_file": "project-details.md"}];
// afterDrawing passes ctx already transformed to network coordinate space.
// Draw node positions raw — no manual pan/zoom/DPR math needed.
network.on('afterDrawing', function(ctx) {
    hyperedges.forEach(h => {
        const positions = h.nodes
            .map(nid => network.getPositions([nid])[nid])
            .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Centroid and expanded hull in network coordinates
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const expanded = positions.map(p => ({
            x: cx + (p.x - cx) * 1.15,
            y: cy + (p.y - cy) * 1.15
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        // Label
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(h.label, cx, cy - 5);
        ctx.restore();
    });
});
</script>
