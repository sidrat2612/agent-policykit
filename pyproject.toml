[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-policykit"
version = "0.1.0"
description = "Universal instruction compiler for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "siddharth Rathore", email = "siddharth.rathore2612@gmail.com" },
]
keywords = ["ai", "coding-agents", "governance", "instructions", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "deepdiff>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
agent-policykit = "agent_policykit.cli:main"

[project.urls]
Homepage = "https://github.com/sidrat2612/agent-policykit"
Repository = "https://github.com/sidrat2612/agent-policykit"
Issues = "https://github.com/sidrat2612/agent-policykit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_policykit"]

[tool.agent-policykit]
# Configuration for agent-policykit itself (dogfooding)
targets = ["copilot", "agents-md"]
languages = ["python"]
project_type = "cli_tool"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["agent_policykit"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
